name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onchain/src
    steps:
      - uses: actions/checkout@v4

      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.7

      - run: aiken fmt --check
      - run: aiken check -D
      - run: aiken build
