[package]
name = "asteria-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = "0.5.2"
async-graphql = "7.2"
async-graphql-rocket = "7.2"
dotenvy = "0.15.7"
uuid = { version = "1.29.0", features = ["v4"] }
rand = "0.8.6"
hex = "0.4.3"
blockfrost = { version = "1.3.0", default-features = false, features = ["rustls-tls"] }
blockfrost-openapi = "0.1.93"
pallas = { version = "1.4.0", features = ["hardano", "phase2", "unstable"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
